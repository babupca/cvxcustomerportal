<div class="container-fluid login-container-outersapce">

  <div class="login-container">
    <div class="left-container">
      <img src="/assets/images/dxc-logo.png">
    </div>
    <div class="right-container">
      <!-- Forgot Password -->
      <div class="row" *ngIf="!isChangePasswordRequest">
        <div class="form-container">
          <h2 class="customer-name">Forgot Password</h2>
          <!-- <h2 class="customer-name">Change Password</h2> -->
          <div class="row tagline-container">
          <h5 class="signin-tagline">Please enter your email ID and submit to get your new password on your email</h5>
        </div>
          <div class="col-lg-12 forgot-container">
            <ul class="forgot-form">
              <li> <input type="text" placeholder="Enter your email id"> </li>
              <!-- change password starts here-->
              <!-- <li> <input type="text" placeholder="Current password"> </li>
               <li> <input type="text" placeholder="New password"> </li>
               <li> <input type="text" placeholder="Re-type New Password"> </li> -->
              <!-- change password ends here-->
            </ul>
            <div class="button-container">
              <div class="button-grp">
                <button type="button" class="btn btn-dark">Submit</button>
                <button type="button" class="btn btn-dark">Cancel</button>
                <!-- change password starts here-->
                <!-- <button type="button" class="btn btn-dark">Submit</button>
                  <button type="button" class="btn btn-dark">Cancel</button> -->
                <!-- change password ends here-->
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Change Password -->
      <div class="row" *ngIf="isChangePasswordRequest">
        <div class="form-container">
          <h2 class="customer-name">Change Password</h2>
          <!-- <div class="row tagline-container">
          <h5 class="signin-tagline">Please enter your email ID and submit to get your new password on your email</h5>
          </div> -->
          <div class="col-lg-12 forgot-container">
            <ul class="forgot-form">
              <!-- <li> <input type="text" placeholder="Enter your email id"> </li> -->
              <!-- change password starts here-->
              <li> <input type="text" placeholder="Current password"> </li>
               <li> <input type="text" placeholder="New password"> </li>
               <li> <input type="text" placeholder="Re-type New Password"> </li>
              <!-- change password ends here-->
            </ul>
            <div class="button-container">
              <div class="button-grp">
                <!-- <button type="button" class="btn btn-dark">Submit</button>
                <button type="button" class="btn btn-dark">Cancel</button> -->
                <!-- change password starts here-->
                <button type="button" class="btn btn-dark">Submit</button>
                <button type="button" class="btn btn-dark">Cancel</button>
                <!-- change password ends here-->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
