<div class="myvisit-class">
  <div class="myvisit-heading">
    <h6>My Visits</h6>
  </div>
  <div class="myvisit-content perfect-scroll-ref">
    <perfect-scrollbar>

    <div class="visit-dates"  *ngFor="let item of visitIdAnddatesArray; let i = index">
      <div><button (click)="sendVisitId(item.visitId,item.currentStage)">{{item.startDate |date:"dd-MMM-yyyy"}} to {{item.endDate |date:"dd-MMM-yyyy"}}</button></div>

    </div>

</perfect-scrollbar>
  </div>
</div>
