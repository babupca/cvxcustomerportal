<div class="fact-class" >
  <div class="fact-heading">
    <h6>Fact Sheet(s)</h6>
  </div>
  <div class="fact-content">
    <!-- <perfect-scrollbar>
    </perfect-scrollbar> -->
    <!-- <pre>
    {{factsheetsArray | json}}</pre> -->
    <div class="city-names" *ngFor="let item of factsheetsArray; let i = index">

    </div>

  </div>
</div>
