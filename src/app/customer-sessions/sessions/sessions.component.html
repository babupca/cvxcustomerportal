<ngx-spinner [fullScreen]="true" type="ball-clip-rotate-multiple" size="medium">
  <p class="loading">Loading Please wait...</p>
</ngx-spinner>
<div>

  <div class="session-filter" id="session-filter" [stickyMenu] elementId="session-filter">
    <section class="session-filters">
      <h2 class="upcoming-session">{{sessions?.upcomingSessionCount}} UPCOMING SESSIONS</h2>
      <div class="session-filter-container">
        <select [(ngModel)]="visitCity" (ngModelChange)="cityChanged($event)">
          <option *ngFor="let session of visitInfo" [ngValue]="session.location">{{session.location}}</option>
        </select>
        <select [(ngModel)]="visitDate" (ngModelChange)="dataChanged($event)">
          <option *ngFor="let dates of visitDates" [ngValue]="dates.dateValue">{{dates.dateValue}}</option>
        </select>
        <span class="refresh-icon" (click)="getRecentData()"></span>
      </div>
    </section>
    <!-- <div class="alert alert-success" role="alert" [hidden]="showRefreshAlert">
      Click on refresh button above to get latest session info!.. 
    </div> -->
  </div>

  <!-- Section container -->
  <div class="sessioncardscontainer" *ngIf="sessiondata && sessiondata.length > 0">
    <!-- <perfect-scrollbar style="max-height: 30rem; margin-top: 2px;"> -->
    <section class="section-list-container">

      <div *ngFor="let session of sessiondata; let i=index;">
        <app-session-item (reloadSessionListData)="reloadForm()" [session]="session" [visitId]="visitId"
          [sessionID]="session.id" [SessionNos]="i+1" [sessionState]="sessionState">
        </app-session-item>
      </div>

    </section>

    <!-- </perfect-scrollbar> -->
  </div>

  <div class="session-footer">
    <a type="generate pdf" (click)="downloadAgenda()" class="session-footer-cta">DOWNLOAD AGENDA

    </a>
    <button class="btn overallfeedback" (click)= "onclickfeedback(visitId)" [disabled]="stage ==='In Flight'|| stage ==='Finalized'" >OVERALL FEEDBACK
    </button>
  </div>


</div>
