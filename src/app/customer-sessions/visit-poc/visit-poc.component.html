<div class="main-container">

      <ul>
        <li class="poc-list">
          <span class="visit-pocs" triggers="manual" container="body" [ngbPopover]="popContent"
          [autoClose]="'outside'" #p1="ngbPopover" placement="auto" popoverClass="customWidth"
          (click)="showUserDetails(p1, item)"> vishnubhotla Lakshmi Tejaswini
          </span>
        </li>
        <li class="poc-list">
          <span class="visit-pocs"> Babu Arumugam
          </span>
        </li>
        <li class="poc-list">
          <span class="visit-pocs"> Ankam Ankam Lakshmipathi Nirmala
          </span>
        </li>
      </ul>
    </div>
    </perfect-scrollbar>
  </div>
</div>
