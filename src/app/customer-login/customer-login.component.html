<div class="container-fluid login-container-outersapce">

    <div class="login-container">
         <div class="left-container">
            <img src="/assets/images/dxc-logo.png">
        </div>
     <div class="right-container">
        <form [formGroup]="customerLogin">
            <div class="row">
                <div class="col-lg-12 form-container">
                    <h2 class="customer-name">Welcome Vishubhotla Lakshmi Tejaswini</h2>
                    <h5 class="signin-tagline">Sign in to Continue</h5>
                    <!-- sasasass{{f.userName.touched}}
                    dirty{{f.userName.dirty}}
                    invalid{{f.userName.invalid}}
                    email{{f.userName.errors | json}}
                        function{{f | json }} -->
                    <div class="col-lg-10">
                        <ul>
                            <li class="form-group"><input formControlName="userName" type="text" placeholder="Enter your email id" class="form-control" [ngClass]="{'is-invalid': f.userName.invalid && f.userName.dirty && f.userName.errors
                            }"> </li>
                            <li class="form-group errormsg" *ngIf="f.userName.invalid && (f.userName.dirty)">Enter Valid EmailID </li>
                            <li class="form-group"><input formControlName="password" type="password" class="form-control" placeholder="Enter your password"  [ngClass]="{'is-invalid': f.password.invalid && f.password.dirty && f.password.errors
                            }"> </li>
                            <!-- <li *ngIf="f.userName.invalid && (f.userName.dirty)">Please Enter Correct Password</li> -->
                        </ul>
                        <div class="button-container">
                            <div class="button-grp">
                                <button type="button" class="btn btn-link" [routerLink]="['/forgotPassword', 1]">Forgot Password</button>
                                <button type="button" class="btn btn-link" [routerLink]="['/forgotPassword', 2]">Change Password</button>
                            </div>
                            <button type="button" class="btn btn-dark" [disabled]='customerLogin.invalid' (click)="loginSubmit()">Login</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        </div>
    </div>
</div>
