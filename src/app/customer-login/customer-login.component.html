        </div>
     <div class="right-container">
            <div class="row">
                <div class="col-lg-12 form-container">
                    <h2 class="customer-name">Welcome Vishubhotla Lakshmi Tejaswini</h2>
                    <h5 class="signin-tagline">Sign in to Continue</h5>

                    <div class="col-lg-10">
                        
                        <ul>
                            <li> <input type="text" placeholder="Enter your email id"> </li>
                            <li> <input type="password" placeholder="Enter your password"> </li>
                        </ul>
                        <div class="button-container">
                            <div class="button-grp">
                                <button type="button" class="btn btn-link" [routerLink]="['/forgotPassword', 1]">Forgot Password</button>
                                <button type="button" class="btn btn-link" [routerLink]="['/forgotPassword', 2]">Change Password</button>
                            </div>
                            <button type="button" class="btn btn-dark" (click)="loginSubmit()">Login</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
